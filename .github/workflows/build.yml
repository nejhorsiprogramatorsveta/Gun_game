# Builds ready-to-play ZIPs for friends.
# - push to main  -> rolling prerelease "dev" (always the newest build, fixed URL)
# - push tag v*   -> stable GitHub Release
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GAME_NAME: gun_game

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for version tags

      - name: Cache Godot downloads
        uses: actions/cache@v6
        with:
          path: |
            .tools/*.zip
            .tools/*.tpz
          key: godot-${{ hashFiles('tools/setup_env.sh') }}-linux

      - name: Install pinned Godot + export templates
        run: tools/setup_env.sh --with-templates

      - name: Import project
        # The first import on a clean checkout logs harmless "cannot open translation" errors.
        run: tools/godot --headless --path . --import

      - name: Unit tests
        run: tools/godot --headless --path . -s tests/run_tests.gd

      - name: Localization check
        run: tools/godot --headless --path . -s tools/check_localization.gd

      - name: Write build info
        id: info
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"; channel="stable"
          else
            last_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
            version="${last_tag#v}"; channel="dev"
          fi
          commit="$(git rev-parse --short=7 HEAD)"
          printf '{"version":"%s","commit":"%s","channel":"%s"}\n' "$version" "$commit" "$channel" > build_info.json
          cat build_info.json
          echo "build_id=${version}+${commit}" >> "$GITHUB_OUTPUT"

      - name: Export
        run: |
          mkdir -p build/windows build/macos build/linux
          tools/godot --headless --path . --export-release "Windows Desktop" "build/windows/${GAME_NAME}.exe"
          tools/godot --headless --path . --export-release "macOS" "build/macos/${GAME_NAME}.zip"
          tools/godot --headless --path . --export-release "Linux" "build/linux/${GAME_NAME}.x86_64"
          test -f "build/windows/${GAME_NAME}.exe" && test -f "build/macos/${GAME_NAME}.zip" && test -f "build/linux/${GAME_NAME}.x86_64"

      - name: Package downloads
        run: |
          mkdir -p dist
          # Windows: the .exe contains the whole game (PCK embedded), so it is shipped directly.
          cp "build/windows/${GAME_NAME}.exe" "dist/${GAME_NAME}-windows.exe"
          # macOS: a .app is a folder and must stay zipped; Linux: zip keeps the executable bit.
          cp "build/macos/${GAME_NAME}.zip" "dist/${GAME_NAME}-macos.zip" # Godot already zips the .app
          chmod +x "build/linux/${GAME_NAME}.x86_64"
          (cd build/linux && zip -9 -r "../../dist/${GAME_NAME}-linux.zip" .)
          ls -la dist

      - name: Release notes
        run: |
          cat > notes.md <<EOF
          **Build:** \`${{ steps.info.outputs.build_id }}\` (verze je vidět vlevo dole v menu – všichni hráči musí mít stejnou)

          ### Co stáhnout
          - **Windows:** \`${GAME_NAME}-windows.exe\` → stáhnout a spustit
          - **macOS:** \`${GAME_NAME}-macos.zip\` → rozbalit → otevřít \`${GAME_NAME}.app\`
          - **Linux:** \`${GAME_NAME}-linux.zip\`

          ⚠️ „Source code (zip)“ jsou zdrojové kódy, ne hra.

          Návod (SmartScreen, macOS, hraní s kamarády): https://github.com/${{ github.repository }}#readme
          EOF

      - name: Publish rolling dev prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f dev
          git push -f origin refs/tags/dev
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev --prerelease --title "Nejnovější vývojová verze" --notes-file notes.md
          fi
          gh release edit dev --prerelease --title "Nejnovější vývojová verze" --notes-file notes.md
          gh release upload dev dist/* --clobber
          # Older builds shipped Windows as a ZIP; remove it so nobody downloads a stale copy.
          gh release delete-asset dev "${GAME_NAME}-windows.zip" --yes || true

      - name: Publish stable release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "${GAME_NAME} ${GITHUB_REF_NAME}" --notes-file notes.md --generate-notes
